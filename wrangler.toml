# Cloudflare Workers deployment for the tablet app.
#
# Assets-only: there is no server-side Worker code. The PWA is a static bundle
# that talks directly to Supabase, so Cloudflare is only serving files.
#
# Build: `npm run build` (Cloudflare runs this), output in ./dist
# Deploy: `npx wrangler deploy`

name = "barbering-shop"
compatibility_date = "2025-01-01"

# Publish the <name>.<subdomain>.workers.dev URL. Without this the Worker can
# deploy successfully and still have no hostname pointing at it, which looks
# like a broken site ("cannot be reached") rather than a routing gap.
# A custom domain is added in the dashboard and works alongside this.
workers_dev = true

[assets]
directory = "./dist"

# The app is a single-page app: /today and /cash-count are client-side routes
# with no file behind them. Without this, a refresh on either — or the manager
# reopening the installed app on a sub-route — would 404.
not_found_handling = "single-page-application"
