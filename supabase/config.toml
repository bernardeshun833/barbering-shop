project_id = "kumasi-barbershop-pos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Edge Functions. Secrets (MoMo, Resend, WhatsApp credentials) are set via
# `supabase secrets set` — never committed here.
#
# Both require a valid JWT. Every caller already sends one: the pg_cron jobs
# pass the service role key (migration 0005), and so does the "Run nightly
# reconciliation" workflow. Left open, anyone who learned the URL could
# trigger the owner's email at will and read back the day's severity.
[functions.momo-sync]
verify_jwt = true

[functions.nightly-reconciliation]
verify_jwt = true
