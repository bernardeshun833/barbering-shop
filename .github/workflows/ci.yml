name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typechecks the tablet app, the tests and both edge functions.
      - run: npm run lint

      - run: npm test

      # No Supabase credentials needed: the client is bundled, not executed,
      # so a build proves the app compiles without reaching any backend.
      - run: npm run build
